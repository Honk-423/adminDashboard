<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Administrator Dashboard</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="grid">
            <div id="header">
                <form action="">
                    <label for="search"></label>
                    <input type="search" name="search" id="search">
                    <button class="btn">New</button>
                    <button class="btn">Upload</button>
                    <button class="btn">Share</button>
                </form>
            </div>
            <div id="sidebar">
                <div id="adminInfo">
                    <div id="adminPfp"></div>
                    <div id="adminName"></div>
                    <nav id="links">
                        <div id="home">
                            <img id="homeIcon" src="" alt="">
                            <a href="">Home</a>
                        </div>
                        <div id="profile">
                            <img id="profileIcon" src="" alt="">
                            <a href="">Profile</a>
                        </div>
                        <div id="messages">
                            <img id="messagesIcon" src="" alt="">
                            <a href="">Messages</a>
                        </div>
                        <div id="communities">
                            <img id="communitiesIcon" src="" alt="">
                            <a href="">Communities</a>
                        </div>
                        <div id="settings">
                            <img id="settingsIcon" src="" alt="">
                            <a href="">Settings</a>
                        </div>
                        <div id="support">
                            <img id="supportIcon" src="" alt="">
                            <a href="">Support</a>
                        </div>
                        <div id="privacy">
                            <img id="privacyIcon" src="" alt="">
                            <a href="">Privacy</a>
                        </div>
                    </nav>
                </div>
            </div>
            <div id="content">
                <div id="projects">
                    <p>Your Projects</p>
                    <div class="project a"></div>
                    <div class="project b"></div>
                    <div class="project c"></div>
                    <div class="project d"></div>
                    <div class="project e"></div>
                    <div class="project f"></div>
                </div>
                <div id="trending">
                    <p>Trending</p>
                    <div class="trendingUser a">
                        <img class="pfp" src="" alt="">
                        <p class="username"></p>
                        <p class="projectName"></p>
                    </div>
                    <div class="trendingUser b">
                        <img class="pfp" src="" alt="">
                        <p class="username"></p>
                        <p class="projectName"></p>
                    </div>
                    <div class="trendingUser c">
                        <img class="pfp" src="" alt="">
                        <p class="username"></p>
                        <p class="projectName"></p>
                    </div>
                    <div class="trendingUser d">
                        <img class="pfp" src="" alt="">
                        <p class="username"></p>
                        <p class="projectName"></p>
                    </div>
                </div>
                <div id="announcements">
                    <p>Announcements</p>
                    <div class="announcementA">
                        <p class="announcmentName"></p>
                        <p class="announcment"></p>
                    </div>
                    <div class="announcementB">
                        <p class="announcmentName"></p>
                        <p class="announcment"></p>
                    </div>
                    <div class="announcementC">
                        <p class="announcmentName"></p>
                        <p class="announcment"></p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
