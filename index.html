<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Administrator Dashboard</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="grid">
            <div id="header">
                <form action="">
                    <label for="search"></label>
                    <input type="search" name="search" id="search">
                    <button class="btn">New</button>
                    <button class="btn">Upload</button>
                    <button class="btn">Share</button>
                </form>
            </div>
            <div id="sidebar">
                <div id="profile">
                    <div id="pfp"></div>
                    <div id="username"></div>
                </div>
            </div>
            <div id="content">
                <div id="projects">
                    <p>Your Projects</p>
                </div>
                <div id="trending">
                    <p>Trending</p>
                </div>
                <div id="announcements">
                    <p>Announcements</p>
                </div>
            </div>
        </div>
    </body>
</html>
