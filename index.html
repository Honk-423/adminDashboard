<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Administrator Dashboard</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="grid">
            <div id="header">
                <form action="">
                    <label for="search"></label>
                    <input type="search" name="search" id="search">
                    <button class="btn">New</button>
                    <button class="btn">Upload</button>
                    <button class="btn">Share</button>
                </form>
            </div>
            <div id="sidebar">
                <div id="adminInfo">
                    <div id="adminPfp"></div>
                    <div id="adminName"></div>
                    <nav id="links">
                        <a href="">Home</a>
                        <a href="">Profile</a>
                        <a href="">Messages</a>
                        <a href="">Communities</a>
                        <a href="">Settings</a>
                        <a href="">Support</a>
                        <a href="">Privacy</a>
                    </nav>
                </div>
            </div>
            <div id="content">
                <div id="projects">
                    <p>Your Projects</p>
                </div>
                <div id="trending">
                    <p>Trending</p>
                    <div class="trendingUser a">
                        <img class="pfp" src="" alt="">
                        <p class="username"></p>
                        <p class="projectName"></p>
                    </div>
                    <div class="trendingUser b">
                        <img class="pfp" src="" alt="">
                        <p class="username"></p>
                        <p class="projectName"></p>
                    </div>
                    <div class="trendingUser c">
                        <img class="pfp" src="" alt="">
                        <p class="username"></p>
                        <p class="projectName"></p>
                    </div>
                    <div class="trendingUser d">
                        <img class="pfp" src="" alt="">
                        <p class="username"></p>
                        <p class="projectName"></p>
                    </div>
                </div>
                <div id="announcements">
                    <p>Announcements</p>
                </div>
            </div>
        </div>
    </body>
</html>
